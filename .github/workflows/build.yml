name: build

# Every push (any branch, in this repository or a fork that enables Actions) and
# every pull request is built and tested, and the release zip is attached to the
# run as an artifact, so a change can be tried in game without a local toolchain.
# Only a v* tag creates a release, and only as a draft.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reference build: releases come from this job only.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 zip

      - name: Build, test, generate .conf
        run: bash ./build.sh

      - name: Package
        run: bash ./tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MagickaPoolFix
          path: dist/*.zip
          if-no-files-found: error

  # The CMake path for contributors, cross-compiled with the same MinGW-w64 flags.
  cmake-mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64

      - name: Plugin
        run: |
          cmake -B build-cmake -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake

      - name: Unit tests
        run: |
          cmake -B build-tests -DMPF_BUILD_TESTS=ON -DMPF_BUILD_PLUGIN=OFF
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  # The CMake path with MSVC, for contributors on Windows. Not used for releases.
  # Non-blocking until it has passed once: the MSVC build had never been run
  # before this job was added.
  cmake-msvc:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Plugin
        run: |
          cmake -B build-cmake -A x64
          cmake --build build-cmake --config Release

      - name: Unit tests
        run: |
          cmake -B build-tests -A x64 -DMPF_BUILD_TESTS=ON -DMPF_BUILD_PLUGIN=OFF
          cmake --build build-tests --config Release
          ctest --test-dir build-tests -C Release --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, cmake-mingw]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MagickaPoolFix

      - name: Check the tag matches the plugin version
        run: |
          want="MagickaPoolFix-${GITHUB_REF_NAME#v}.zip"
          [ -f "$want" ] || { echo "tag $GITHUB_REF_NAME does not match the built zip: $(ls *.zip)"; exit 1; }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --repo "$GITHUB_REPOSITORY" --draft --title "MagickaPoolFix $GITHUB_REF_NAME"
